name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: roadmap dependency graph
        run: python3 scripts/check-roadmap.py
      - name: stats layer declares no I/O dependencies
        run: ./scripts/check-stats-deps.sh
      - name: stats layer does not reach std I/O
        # CLIPPY_CONF_DIR points at crates/stats/clippy.toml, which disallows
        # std::fs, std::net and std::process by resolved path. Scoped to that
        # crate: the rest of the workspace is allowed to do I/O, that is its job.
        run: CLIPPY_CONF_DIR=crates/stats cargo clippy -p bestiario-stats --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov
        # Reported, not enforced. The 80% gate of docs/SPEC.md §12 is turned on
        # in roadmap PR 30, once the E2E test exists to make the number mean
        # something.
        run: cargo llvm-cov --workspace --all-features --summary-only
