# DigitalOcean App Platform spec for bestiario. See docs/DEPLOY.md.
#
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# The spec is versioned so that the deployment is reviewed like everything
# else: a change to the relays being indexed is a pull request, not a click in
# a dashboard.
#
# bestiario serves no HTTP, so it is a `worker` and not a `service`: no port,
# no health check, no public URL. Workers require a paid plan.

name: bestiario
region: nyc

workers:
  - name: indexer
    # Built from this repository's Dockerfile. App Platform has no Rust
    # buildpack, so a Dockerfile is not an optimisation here, it is the only
    # way in.
    dockerfile_path: Dockerfile
    source_dir: /

    github:
      repo: MostroP2P/bestiario
      branch: main
      deploy_on_push: true

    instance_size_slug: apps-s-1vcpu-1gb

    # A worker has no health check — nothing polls it, because it listens on
    # nothing — so a crash loop is invisible unless something counts the
    # restarts. App Platform restarts a failed container indefinitely and
    # reports the app as ACTIVE throughout.
    #
    # The threshold is deliberately low. This daemon should restart on deploys
    # and not otherwise; three restarts inside five minutes is already a loop,
    # not a blip.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
        disabled: false

      # The backfill holds a window of events in memory, so memory pressure
      # shows up as an OOM kill and then as the restart loop above. This fires
      # first, while there is still something to look at.
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 85
        window: TEN_MINUTES
        disabled: false

    # `backfill` walks the relays' history, `sync` follows them live, and the
    # daemon needs both: `sync` alone subscribes from roughly now, so a
    # deployment that skipped the backfill would report on the last few days
    # and silently call it the network. Both are wrapped so the index is
    # restored from Spaces before either runs and streamed back as they write.
    #
    # The backfill repeats on every restart, which is deliberate. It is
    # idempotent — events already stored come back as duplicates and are
    # dropped — and it costs a couple of minutes, in exchange for an index
    # that repairs itself if the replica is ever lost or truncated.
    # One command, no shell operators: run_command is not guaranteed to reach a
    # shell, and one carrying `&&` exits non-zero before the daemon starts.
    # BESTIARIO_BACKFILL_FIRST below asks for the history walk instead.
    run_command: bestiario-replicated sync

    # Not a knob. litestream's lock lives inside the SQLite file, so it cannot
    # see a second container replicating the same bucket prefix; two instances
    # would interleave writes into one replica and corrupt it.
    instance_count: 1

    envs:
      # ---------------------------------------------------------------------
      # What to read
      #
      # No settings.toml is shipped in the image: every value below is the
      # BESTIARIO__* override of the matching key in settings.toml.example.
      # Lists are one variable, comma separated.
      # ---------------------------------------------------------------------
      - key: BESTIARIO__NOSTR__RELAYS
        scope: RUN_TIME
        value: "wss://relay.mostro.network,wss://nos.lol"

      - key: BESTIARIO__NOSTR__DISCOVER_RELAYS
        scope: RUN_TIME
        value: "false"

      - key: BESTIARIO__INDEXER__INSTANCES
        scope: RUN_TIME
        value: "82fa8cb978b43c79b2156585bac2c011176a21d2aead6d9f7c575c005be88390"

      - key: BESTIARIO__INDEXER__ACCEPT_UNKNOWN_INSTANCES
        scope: RUN_TIME
        value: "false"

      - key: BESTIARIO__INDEXER__NETWORKS
        scope: RUN_TIME
        value: "mainnet"

      # `sync` alone subscribes from roughly now and never walks the relays'
      # history, so the index would hold the last few days and present them as
      # the network. Assembled inside deploy/replicated.sh, where a shell is
      # guaranteed. Idempotent, so repeating it on every start is cheap.
      - key: BESTIARIO_BACKFILL_FIRST
        scope: RUN_TIME
        value: "true"

      - key: BESTIARIO__INDEXER__BACKFILL_FROM
        scope: RUN_TIME
        value: "1735689600"

      # ---------------------------------------------------------------------
      # Where to write
      #
      # The App Platform filesystem is ephemeral, so /data survives nothing.
      # litestream makes it a cache of a Spaces bucket instead: restored
      # before the daemon starts, streamed back out as it writes. The index
      # now outlives the container; see docs/DEPLOY.md.
      #
      # BESTIARIO__DATABASE__URL and BESTIARIO_DB_PATH must name the same
      # file. Both are already set in the image and are repeated here only
      # because a deployment that changes one has to change the other.
      # ---------------------------------------------------------------------
      - key: BESTIARIO__DATABASE__URL
        scope: RUN_TIME
        value: "sqlite:///data/bestiario.db"

      - key: BESTIARIO_DB_PATH
        scope: RUN_TIME
        value: "/data/bestiario.db"

      - key: LITESTREAM_BUCKET
        scope: RUN_TIME
        value: "mostro-bestiario-index"

      # A prefix inside the bucket, not a filename. Two deployments sharing
      # one prefix replicate over each other.
      - key: LITESTREAM_PATH
        scope: RUN_TIME
        value: "bestiario"

      - key: LITESTREAM_REGION
        scope: RUN_TIME
        value: "nyc3"

      - key: LITESTREAM_ENDPOINT
        scope: RUN_TIME
        value: "nyc3.digitaloceanspaces.com"

      # A Spaces key scoped to readwrite on that one bucket, and nothing
      # else. Replace both placeholders before deploying; `doctl apps update`
      # encrypts them in place.
      - key: LITESTREAM_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_ME"

      - key: LITESTREAM_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_ME"

      - key: RUST_LOG
        scope: RUN_TIME
        value: "bestiario=info,bestiario_stats=info,warn"

      # ---------------------------------------------------------------------
      # Publishing
      #
      # Two variables, and the distinction between them is the point.
      # BESTIARIO__PUBLISH__NSEC is configuration: it holds the *name* of the
      # variable the key lives in, and pasting a key into it is refused at
      # startup. BESTIARIO_PUBLISH_NSEC — one underscore, so outside the
      # BESTIARIO__ prefix and never read as a setting — is the key itself,
      # and is the only value here that is encrypted.
      #
      # Replace the placeholder before deploying. `doctl apps update` encrypts
      # it in place; the ciphertext is what belongs in this file if the spec
      # is ever round-tripped back out.
      # ---------------------------------------------------------------------
      # How often the worker signs and broadcasts the documents of
      # docs/NOSTR-PUBLICATION.md. A `sleep` duration, so `5m`, `90m` and
      # `21600` are all accepted; unset means never publish.
      #
      # The first publication waits out a whole interval, so this wants to be
      # comfortably shorter than the gap between deploys — a value longer than
      # the worker's uptime publishes nothing, ever, without complaining.
      #
      # Five minutes is a deliberate choice and not a free one. What bounds
      # the cost is §8: a run sends only the documents whose payload hash
      # moved, so a quiet interval broadcasts the index and nothing else, and
      # a busy one broadcasts the handful of windows that actually changed.
      # What it buys is a published snapshot that trails the relays by
      # minutes rather than by hours, which is what a client reading these
      # documents as "the network right now" needs.
      - key: BESTIARIO_PUBLISH_EVERY
        scope: RUN_TIME
        value: "5m"

      - key: BESTIARIO__PUBLISH__NSEC
        scope: RUN_TIME
        value: "env:BESTIARIO_PUBLISH_NSEC"

      - key: BESTIARIO_PUBLISH_NSEC
        scope: RUN_TIME
        type: SECRET
        value: "nsec1...REPLACE_ME"

# App Platform has no scheduler, and no publication job is defined here on
# purpose.
#
# `jobs` run around a deploy and nowhere else, so the only shape available
# would be a POST_DEPLOY job — and a job is a component of its own, with its
# own container and its own ephemeral `/data`. Without the litestream
# variables above it starts from an empty database and `bestiario publish`
# replaces the addressable documents with statistics computed from nothing;
# with them, it is a second writer against one bucket prefix, which is the
# one thing replication cannot survive.
#
# Publication therefore runs where the archive is: inside this worker, or
# from a component with a LITESTREAM_PATH of its own. docs/DEPLOY.md covers
# the options.

# App-level alerts. The component's own are declared above, next to the
# component they watch.
#
# What none of these can see: replication going quietly wrong. litestream
# keeps running when a sync fails, so a bucket that stopped receiving writes
# looks exactly like one that is up to date, and no App Platform rule reaches
# inside the container to notice. docs/DEPLOY.md says what does cover it.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DEPLOYMENT_LIVE
