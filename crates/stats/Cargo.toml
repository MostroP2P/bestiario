[package]
name = "bestiario-stats"
description = "Pure aggregations over Mostro network data. Performs no I/O, by construction."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# A direct-dependency allowlist, and half of the no-I/O invariant of
# docs/SPEC.md §8: because sqlx, nostr-sdk, tokio and reqwest are absent here,
# they are not reachable from this crate at all. scripts/check-stats-deps.sh
# fails the build if this list grows without someone deciding it should.
#
# Cargo cannot cover the other half. `std` is always in scope and can open
# files, sockets and processes on its own. That side is enforced by
# clippy.toml next to this file, which disallows those entry points by
# resolved path.
[dependencies]
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
# A serialiser, and no more: the publication envelope of
# docs/NOSTR-PUBLICATION.md §6 carries its payload as a JSON value, and the
# hash of §5 is taken over bytes this crate has to produce itself. On the
# allowlist of scripts/check-stats-deps.sh; it opens nothing.
serde_json.workspace = true
